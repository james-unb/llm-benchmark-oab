name: Testes automatizados

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verificar arquivo de testes
        run: test -f tests/test_avaliar_oab.py

      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v

      - name: Validar resultados modificados
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          from validar_resultados import gerar_resumo

          alterados = subprocess.check_output([
              "git", "diff", "--name-only", "-z",
              "--no-renames", os.environ["BASE_SHA"],
              "HEAD", "--", "resultados/"
          ]).decode().split("\0")

          arquivos = sorted({
              Path(p).with_suffix(".csv")
              for p in alterados
              if p.endswith((".csv", ".json"))
              and not p.startswith("resultados/historico/")
          })

          validar = []

          for csv in arquivos:
              config = csv.with_suffix(".json")

              if not csv.exists() and not config.exists():
                  continue

              validar.append(str(csv))

          if validar:
              subprocess.run([
                  sys.executable,
                  "validar_resultados.py",
                  "--resumo", os.environ["GITHUB_STEP_SUMMARY"],
                  *validar
              ], check=True)
          else:
              print("Nenhum resultado novo ou modificado.")
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
                  f.write(gerar_resumo([]))
          PY
